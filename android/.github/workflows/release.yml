# Builds the signed release APK on GitHub instead of the production host.
#
# Triggers: push a tag like `v1.0.24`, or run it by hand from the Actions tab.
# Signing comes from four repository secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of revayato-release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# The build fails if the APK is not signed by the release certificate, so a
# wrong keystore can never ship an APK that refuses to update in place.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_CERT_SHA256: 741b8ce2e3638ed4f1120675ad5bf95bbec16b787cb7ce20ce709bcb42b6e947

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/revayato-release.keystore
          {
            echo "storeFile=revayato-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and version
        id: meta
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$CERT" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK is signed with $CERT, expected the release certificate"; exit 1
          fi
          BADGING=$("$BT/aapt2" dump badging "$APK" | head -1)
          NAME=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CODE=$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          echo "version_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          cp "$APK" "revayato-$NAME.apk"
          sha256sum "revayato-$NAME.apk" | tee "revayato-$NAME.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: revayato-${{ steps.meta.outputs.version_name }}
          path: revayato-${{ steps.meta.outputs.version_name }}.apk*
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "revayato-${{ steps.meta.outputs.version_name }}.apk" \
            "revayato-${{ steps.meta.outputs.version_name }}.apk.sha256" \
            --title "روایتو ${{ steps.meta.outputs.version_name }}" \
            --notes "versionCode ${{ steps.meta.outputs.version_code }}"

      - name: Remove signing material
        if: always()
        run: rm -f app/revayato-release.keystore keystore.properties
