name: revayato

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment:
      NUXT_PUBLIC_API_BASE: ${API_BASE_URL}/api
      NUXT_PUBLIC_WS_BASE: ${WS_BASE_URL}
      NUXT_PUBLIC_SITE_URL: ${SITE_BASE_URL}
      NUXT_PUBLIC_MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL}
      NUXT_PUBLIC_DOWNLOAD_CDN_BASE_URL: ${DOWNLOAD_CDN_BASE_URL}
      NUXT_PUBLIC_CATALOG_SOURCE: api
      NUXT_PUBLIC_ANALYTICS_TRANSPORT: api
      NUXT_PUBLIC_EVENTS_ENDPOINT: /events/
      NUXT_API_INTERNAL_BASE: http://backend:8000/api
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1536m
    cpus: 1.5
    logging: *default-logging
    networks:
      - edge

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CHANNEL_LAYER_BACKEND: channels_redis.core.RedisChannelLayer
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ${CATALOG_MEDIA_MANIFEST_HOST_PATH:-./backend/catalog-media-manifest.example.json}:/run/catalog-media-manifest.json:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 2g
    cpus: 2.0
    logging: *default-logging
    networks:
      - edge
      - data

  catalog-worker:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    env_file:
      - .env.production
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    volumes:
      - ${CATALOG_MEDIA_MANIFEST_HOST_PATH:-./backend/catalog-media-manifest.example.json}:/run/catalog-media-manifest.json:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging
    networks:
      - edge
      - data

  catalog-beat:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    env_file:
      - .env.production
    entrypoint: []
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    networks:
      - edge
      - data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 1.5
    logging: *default-logging
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
    networks:
      - data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      DOWNLOAD_DOMAIN: ${DOWNLOAD_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      HSTS_MAX_AGE: ${DJANGO_SECURE_HSTS_SECONDS:-3600}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - downloads_data:/srv/downloads:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging
    networks:
      - edge

volumes:
  postgres_data:
  static_data:
  media_data:
  downloads_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  data:
    internal: true
