name: revayato

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    environment:
      NUXT_PUBLIC_API_BASE: ${API_BASE_URL}/api
      NUXT_PUBLIC_WS_BASE: ${WS_BASE_URL}
      NUXT_PUBLIC_SITE_URL: ${SITE_BASE_URL}
      NUXT_PUBLIC_MEDIA_CDN_BASE_URL: ${MEDIA_CDN_BASE_URL}
      NUXT_PUBLIC_DOWNLOAD_CDN_BASE_URL: ${DOWNLOAD_CDN_BASE_URL}
      NUXT_PUBLIC_CATALOG_SOURCE: api
      NUXT_PUBLIC_ANALYTICS_TRANSPORT: api
      NUXT_PUBLIC_EVENTS_ENDPOINT: /events/
      NUXT_API_INTERNAL_BASE: http://backend:8000/api
      # Keep the SSR process under the container mem_limit on 4Gi hosts.
      NODE_OPTIONS: --max-old-space-size=768
      NITRO_COMPRESS_PUBLIC_ASSETS: "1"
    expose:
      - "3000"
    healthcheck:
      # Prefer /health (no SSR). Fall back to favicon for images built before that route.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const urls=['http://127.0.0.1:3000/health','http://127.0.0.1:3000/favicon.svg'];(async()=>{for(const u of urls){try{const r=await fetch(u);if(r.ok)process.exit(0)}catch{}};process.exit(1)})()",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s
    mem_limit: 1024m
    cpus: 1.25
    cpu_shares: 1536
    logging: *default-logging
    networks:
      - edge

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    env_file:
      - .env.production
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "30"
      # Public requests must never pin a worker/database connection indefinitely.
      DB_STATEMENT_TIMEOUT_MS: "5000"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      CELERY_RESULT_BACKEND: redis://redis-queue:6379/1
      CHANNEL_LAYER_BACKEND: channels_redis.core.RedisChannelLayer
      # 2 workers fit a 4Gi host; raise via WEB_CONCURRENCY when more RAM is available.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_LIMIT_CONCURRENCY: ${WEB_LIMIT_CONCURRENCY:-80}
      WEB_KEEPALIVE_SECONDS: ${WEB_KEEPALIVE_SECONDS:-15}
      WEB_MAX_REQUESTS: ${WEB_MAX_REQUESTS:-1500}
      WEB_MAX_REQUESTS_JITTER: ${WEB_MAX_REQUESTS_JITTER:-150}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ${CATALOG_MEDIA_MANIFEST_HOST_PATH:-./backend/catalog-media-manifest.example.json}:/run/catalog-media-manifest.json:ro
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; host=(os.environ.get('DJANGO_ALLOWED_HOSTS') or 'localhost').split(',')[0].strip() or 'localhost'; req=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host': host}); urllib.request.urlopen(req, timeout=6).read()",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1536m
    cpus: 1.5
    cpu_shares: 2048
    logging: *default-logging
    networks:
      - edge
      - data

  catalog-worker:
    image: revayato-backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=768m,noexec,nosuid
    env_file:
      - .env.production
    entrypoint: []
    # Background imports/ffmpeg must leave CPU headroom for the public API on
    # the 2-vCPU production host. Both values remain environment-tunable.
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${CATALOG_WORKER_CONCURRENCY:-1}", "--prefetch-multiplier=1", "--max-tasks-per-child=20", "-Q", "celery"]
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "30"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      CELERY_RESULT_BACKEND: redis://redis-queue:6379/1
    volumes:
      # SoftSub WebVTT extracts must land on the same media volume the API serves.
      - media_data:/app/media
      - ${CATALOG_MEDIA_MANIFEST_HOST_PATH:-./backend/catalog-media-manifest.example.json}:/run/catalog-media-manifest.json:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    mem_limit: 768m
    cpus: ${CATALOG_WORKER_CPUS:-0.35}
    cpu_shares: 128
    logging: *default-logging
    networks:
      - edge
      - data

  catalog-worker-urgent:
    image: revayato-backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=768m,noexec,nosuid
    env_file:
      - .env.production
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=${CATALOG_URGENT_WORKER_CONCURRENCY:-1}", "--prefetch-multiplier=1", "--max-tasks-per-child=15", "-Q", "softsub-urgent"]
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "30"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      CELERY_RESULT_BACKEND: redis://redis-queue:6379/1
    volumes:
      # SoftSub WebVTT extracts must land on the same media volume the API serves.
      - media_data:/app/media
      - ${CATALOG_MEDIA_MANIFEST_HOST_PATH:-./backend/catalog-media-manifest.example.json}:/run/catalog-media-manifest.json:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    mem_limit: 768m
    cpus: ${CATALOG_URGENT_WORKER_CPUS:-0.35}
    cpu_shares: 128
    logging: *default-logging
    networks:
      - edge
      - data

  # Initialize the durable resume volume for the unprivileged crawler user.
  # Named volumes are born root-owned, while the backend image runs as uid 999.
  catalog-crawler-state-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown 999:999 /state && chmod 0750 /state"]
    volumes:
      - crawler_state:/state
    logging: *default-logging

  # Permanent low-priority Film2Media delta crawler. Every round imports only
  # new, directly playable titles and backfills their download sizes, then the
  # process sleeps. A hard CPU cap protects public API/frontend latency.
  catalog-crawler:
    image: revayato-backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    env_file:
      - .env.production
    entrypoint: []
    command: ["python", "/app/scripts/run_myf2m_catalog_loop.py"]
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "0"
      # Bulk ingestion has its own CPU cap and may legitimately run longer reads.
      DB_STATEMENT_TIMEOUT_MS: "30000"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      CELERY_RESULT_BACKEND: redis://redis-queue:6379/1
      MYF2M_CRAWL_INTERVAL_SECONDS: ${MYF2M_CRAWL_INTERVAL_SECONDS:-21600}
      # 1.4s stays just below the configured 45 requests/minute provider budget.
      MYF2M_BULK_CRAWL_DELAY_SECONDS: ${MYF2M_BULK_CRAWL_DELAY_SECONDS:-1.4}
      MYF2M_CRAWL_WORKERS: ${MYF2M_CRAWL_WORKERS:-6}
      MYF2M_LISTING_DELAY: ${MYF2M_LISTING_DELAY:-0.08}
      MYF2M_RECENT_MOVIE_PAGES: ${MYF2M_RECENT_MOVIE_PAGES:-16}
      MYF2M_RECENT_SERIES_PAGES: ${MYF2M_RECENT_SERIES_PAGES:-10}
      # Until provider coverage is complete, run the full missing-title sweep
      # every round before quality/episode refresh jobs.
      MYF2M_DEEP_SWEEP_EVERY_ROUNDS: ${MYF2M_DEEP_SWEEP_EVERY_ROUNDS:-1}
      MYF2M_SIZE_WORKERS: ${MYF2M_SIZE_WORKERS:-4}
      MYF2M_SIZE_TIMEOUT_SECONDS: ${MYF2M_SIZE_TIMEOUT_SECONDS:-10}
      MYF2M_CRAWLER_NICE: ${MYF2M_CRAWLER_NICE:-10}
      MYF2M_REFRESH_DELAY_SECONDS: ${MYF2M_REFRESH_DELAY_SECONDS:-0.7}
      MYF2M_SERIES_REFRESH_LIMIT: ${MYF2M_SERIES_REFRESH_LIMIT:-150}
      MYF2M_SERIES_REFRESH_YEAR_MIN: ${MYF2M_SERIES_REFRESH_YEAR_MIN:-2023}
      MYF2M_MOVIE_REFRESH_LIMIT: ${MYF2M_MOVIE_REFRESH_LIMIT:-200}
      MYF2M_MOVIE_REFRESH_ORDER: ${MYF2M_MOVIE_REFRESH_ORDER:-stale}
      MYF2M_CRAWL_CHECKPOINT: /var/lib/revayato-crawler/myf2m-listings.json
      MYF2M_TMDB_MISS_CACHE_SECONDS: ${MYF2M_TMDB_MISS_CACHE_SECONDS:-604800}
    volumes:
      - media_data:/app/media
      - crawler_state:/var/lib/revayato-crawler
      - ${CATALOG_MEDIA_MANIFEST_HOST_PATH:-./backend/catalog-media-manifest.example.json}:/run/catalog-media-manifest.json:ro
      # Keep the operations runner hot-patchable without rebuilding the large
      # backend image; normal future images also contain these scripts.
      - ./backend/scripts/run_myf2m_catalog_loop.py:/app/scripts/run_myf2m_catalog_loop.py:ro
      - ./backend/scripts/import_missing_myf2m_batch.py:/app/scripts/import_missing_myf2m_batch.py:ro
      - ./backend/scripts/backfill_download_sizes.py:/app/scripts/backfill_download_sizes.py:ro
      - ./backend/scripts/refresh_series_new_episodes.py:/app/scripts/refresh_series_new_episodes.py:ro
      - ./backend/scripts/refresh_movie_download_links.py:/app/scripts/refresh_movie_download_links.py:ro
      - ./backend/apps/catalog/provider_import/providers/cdn_link_parse.py:/app/apps/catalog/provider_import/providers/cdn_link_parse.py:ro
    depends_on:
      catalog-crawler-state-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: ${MYF2M_BULK_CRAWLER_CPUS:-1.25}
    cpu_shares: 64
    logging: *default-logging
    networks:
      - edge
      - data

  catalog-beat:
    image: revayato-backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    env_file:
      - .env.production
    entrypoint: []
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CONN_MAX_AGE: "30"
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis-queue:6379/0
      CELERY_RESULT_BACKEND: redis://redis-queue:6379/1
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    cpu_shares: 128
    logging: *default-logging
    networks:
      - edge
      - data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Parallel query workers exchange data through /dev/shm; Docker's default
    # 64MB is far too small and causes "No space left on device" 500s on search.
    shm_size: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=150
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=16MB
      - -c
      - default_statistics_target=100
      - -c
      - idle_in_transaction_session_timeout=60000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 1.5
    cpu_shares: 2048
    logging: *default-logging
    networks:
      - data

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --tcp-keepalive
      - "60"
      - --timeout
      - "300"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 640m
    cpus: 0.5
    cpu_shares: 512
    logging: *default-logging
    networks:
      - data

  redis-queue:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - celery_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 640m
    cpus: 0.5
    cpu_shares: 512
    logging: *default-logging
    networks:
      - data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.${SITE_DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL}
      HSTS_MAX_AGE: ${DJANGO_SECURE_HSTS_SECONDS:-3600}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Direct-origin cleartext fallback for the native app (see ops/Caddyfile :8080).
      - "8080:8080"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - downloads_data:/srv/downloads:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5
    cpu_shares: 1024
    logging: *default-logging
    networks:
      - edge

  # One-shot: copy the staged APK(s) from ./downloads into the downloads_data
  # volume that Caddy serves at /srv/downloads (see ops/Caddyfile /downloads/*).
  # Nothing else populates that volume, so without this the /app download link
  # 404s. Run with `docker compose run --rm downloads-seed` (see ops/deploy.sh).
  # The APK is gitignored, so ops/deploy.sh stages it from android-app/dist/
  # (or a GitHub Release) onto the host before this runs.
  downloads-seed:
    image: busybox:1.36
    volumes:
      - downloads_data:/srv/downloads
      - ./downloads:/seed:ro
    command: sh -c "cp -f /seed/*.apk /srv/downloads/ 2>/dev/null; echo '--- /srv/downloads ---'; ls -l /srv/downloads"
    restart: "no"
    networks:
      - edge
    logging: *default-logging

volumes:
  postgres_data:
  static_data:
  media_data:
  downloads_data:
  caddy_data:
  caddy_config:
  celery_queue_data:
  crawler_state:

networks:
  edge:
  data:
    internal: true
