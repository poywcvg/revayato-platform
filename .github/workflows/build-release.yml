name: Build Android APK + Release

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Revayato APK
    runs-on: ubuntu-latest

    env:
      COREPACK_ENABLE_PROJECT_SPEC: '0'
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://revayato.com/api' }}
      REVAYATO_DEFAULT_API_BASE: ${{ vars.REVAYATO_DEFAULT_API_BASE || 'https://revayato.com/api' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup pnpm 9.15.0
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 9.15.0
          run_install: false

      - name: Verify tools
        run: |
          node --version
          npm --version
          pnpm --version
          java -version

      - name: Install dependencies
        working-directory: android-app
        run: pnpm install --frozen-lockfile

      - name: Copy fonts/assets into native res
        working-directory: android-app
        run: pnpm assets

      - name: Typecheck
        working-directory: android-app
        run: pnpm typecheck

      - name: Lint
        working-directory: android-app
        run: pnpm lint

      - name: Unit tests (data layer)
        working-directory: android-app
        run: pnpm test

      - name: Build release APK
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android-app/android/app/build/outputs/apk/release/app-release.apk \
             android-app/android/app/build/outputs/apk/release/Revayato-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: revayato-apk
          path: android-app/android/app/build/outputs/apk/release/Revayato-v1.0.apk
          retention-days: 14

      - name: Build WebView APK
        working-directory: webview-app
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Revayato-WebView.apk

      - name: Upload WebView APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: revayato-webview-apk
          path: webview-app/dist/Revayato-WebView.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/app-')
        with:
          name: Revayato ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Revayato Android application.

            - Revayato-v1.0.apk
            - Revayato-WebView.apk
            - API_BASE_URL = https://revayato.com/api
          files: |
            android-app/android/app/build/outputs/apk/release/Revayato-v1.0.apk
            webview-app/dist/Revayato-WebView.apk
          fail_on_unmatched_files: false